<header class="site-header">
  <div class="shell header-row">
    <a class="lockup" href="{{ relURL "" }}">
      <img class="lockup__mark" src="{{ relURL "images/cdr-shops-mark.svg" }}" alt="" width="32" height="32">
      <span class="lockup__word">CDR <em>SHOPS</em></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Menu"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if eq page.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
